<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <!-- IG Navbar -->
    <nav class="ig-navbar mb-4">
        <div class="container d-flex justify-content-between align-items-center h-100">
            <a href="index.html" class="ig-logo">SocialSphere</a>
            <div class="d-flex gap-4 fs-4 align-items-center h-100">
                <i class="bi bi-house-door-fill cursor-pointer"></i>
                <i class="bi bi-plus-square cursor-pointer"></i>
                <i class="bi bi-compass cursor-pointer"></i>
                <i class="bi bi-heart cursor-pointer"></i>
                <div class="post-avatar-sm" style="width: 24px; height: 24px; font-size: 8px; margin-right: 0;">JD</div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-9 col-lg-6">
                <!-- Stories Bar -->
                <div id="stories" class="story-container">
                    <!-- Skeletons -->
                    <div class="story-item">
                        <div class="skeleton" style="width: 60px; height: 60px; border-radius: 50%;"></div>
                    </div>
                    <div class="story-item">
                        <div class="skeleton" style="width: 60px; height: 60px; border-radius: 50%;"></div>
                    </div>
                    <div class="story-item">
                        <div class="skeleton" style="width: 60px; height: 60px; border-radius: 50%;"></div>
                    </div>
                </div>

                <!-- Main Feed -->
                <div id="feed">
                    <!-- Post Skeletons -->
                    <div class="ig-post">
                        <div class="post-header">
                            <div class="skeleton" style="width: 30px; height: 30px; border-radius: 50%;"></div>
                        </div>
                        <div class="skeleton" style="width: 100%; aspect-ratio: 1/1;"></div>
                    </div>
                </div>
            </div>

            <!-- Side Suggestions -->
            <div class="col-md-3 d-none d-md-block">
                <div class="d-flex align-items-center mb-4 mt-2">
                    <div class="post-avatar-sm" style="width: 56px; height: 56px; font-size: 18px;">JD</div>
                    <div class="ms-3">
                        <div class="fw-bold">john_doe</div>
                        <div class="text-ig-secondary">John Doe</div>
                    </div>
                    <a href="#" class="ms-auto text-ig-link" style="font-size: 12px;">Switch</a>
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <span class="text-ig-secondary fw-semibold">Suggestions for you</span>
                    <a href="#" class="text-dark fw-semibold" style="font-size: 12px; text-decoration: none;">See
                        All</a>
                </div>

                <div id="suggestedFriends">
                    <!-- Populated by JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/users.js"></script>
</body>

</html>
