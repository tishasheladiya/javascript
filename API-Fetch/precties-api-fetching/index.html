<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Card</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    margin:0;
}

/* main container */
.main{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap:25px;
    padding:40px;
}

/* card */
.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.profile{
    text-align:center;
    margin-bottom:15px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#667eea;
    color:white;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
}

.profile h2{
    margin:10px 0 5px;
    font-size:20px;
}

.username{
    color:#777;
    font-size:14px;
}

.info p{
    margin:6px 0;
    font-size:14px;
}

.section{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #eee;
}

.section h3{
    margin-bottom:6px;
    font-size:15px;
}

</style>
</head>
